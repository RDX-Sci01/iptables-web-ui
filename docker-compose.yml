services:
  iptables-web-ui:
    container_name: iptables-web-ui
    image: ghcr.io/rdx-sci01/iptables-web-ui:latest
    network_mode: host
    cap_add:
     - NET_ADMIN
    volumes:
      - iptables-web-ui_data:/app/data
      - /etc/iptables:/etc/iptables # Optional, necessary for saving lists for iptables-persistent
    env_file:
      - .env
    environment:
      - TZ=<timezone>
    restart: unless-stopped
    # SECURITY: Set resource limits to prevent DoS
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
